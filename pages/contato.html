            <h2>Entre em contato</h2>

            <form id="formularioContato">

                <label for="nome">Nome:</label>

                <label for="email">E-mail:</label>

                <label for="textoMensagem">Mensagem:</label>
                <textarea id="textoMensagem" rows="5" required></textarea>

                <button id="botaoMensagem">Enviar mensagem</button>

<p id="mensagemContato" aria-live="polite">Preencha os campos para entrar em contato.</p>

            </form>
